<style>
:root{--paper:#F4F6F9;--card:#FFFFFF;--ink:#16203A;--muted:#566079;--line:#D9DFE9;--hl:#F6CB45;--hl-soft:#FCEFC0;--teal:#1E7568;
--display:"Young Serif",Georgia,serif;--body:"Figtree",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root{--paper:#0F1420;--card:#171E2E;--ink:#E7EBF4;--muted:#9BA4BA;--line:#2A3349;--hl:#E9BC36;--hl-soft:#3A3218;--teal:#58B9A9;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:40px 16px 64px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,48px);line-height:1.15;margin:0 0 10px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:32px 0 12px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.lesson h3{margin:0;font-size:18px}
.lesson .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.links a:hover,.links a:focus-visible{background:var(--hl-soft);outline:none}
.soon{color:var(--muted);font-size:14px}
</style>
</head>
